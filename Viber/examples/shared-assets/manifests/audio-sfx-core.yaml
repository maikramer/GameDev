# Pack audio-sfx-core — os 4 clips base da engine Viber (hit/whoosh/harvest/ui).
# Substitui os stubs .wav sintéticos (sfx/*.wav) por versões Stable Audio 3
# Small SFX; a engine (`Viber/src/ambient.rs::SfxClip`) aponta para os .ogg.
# Regenerar: cd examples/shared-assets && gameassets resume --profile game.yaml --manifest manifests/audio-sfx-core
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/hit
    idea: Punchy melee combat hit impact, powerful short strike thud with bright transient, RPG battle connect
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 210
  - id: sfx/whoosh
    idea: Quick air whoosh weapon swing, fast blade swish cutting through air, short wind-up swoosh
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 410
  - id: sfx/harvest
    idea: Gentle harvest pluck, gathering fresh herbs with soft plant rustle, short rewarding collect pop
    kind: prop
    category: sfx_collectible
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 420
  - id: sfx/ui
    idea: Soft UI interface click, clean short menu select blip, subtle confirmation tick
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 430
