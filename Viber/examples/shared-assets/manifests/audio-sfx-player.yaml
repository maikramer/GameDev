# Pack audio-sfx-player — movimentos do herói (Stable Audio 3 Small SFX).
# Canónico em examples/shared-assets/. Regenerar:
#   cd examples/shared-assets && gameassets resume --profile game.yaml --manifest manifests/audio-sfx-player
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/player/jump
    idea: Light agile jump, quick soft hop spring with brief whoosh, short character leap
    kind: prop
    category: sfx_movement
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 440
  - id: sfx/player/dash
    idea: Fast dash burst, airy swoosh of sudden momentum, short wind rushing past the player
    kind: prop
    category: sfx_movement
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 441
  - id: sfx/ambient/footstep
    idea: Soft footstep on dry grass and dirt, single short walking step crunch, light footfall
    kind: prop
    category: sfx_movement
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 442
  - id: sfx/ambient/footstep_water
    idea: Footstep splashing in shallow water, short wet splash step, light wading sound
    kind: prop
    category: sfx_movement
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 443
